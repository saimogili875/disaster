<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Disaster Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: #1e293b;
            border-bottom: 2px solid #334155;
        }
        .top-bar h1 {
            font-size: 1.1rem;
            color: #f1f5f9;
        }
        .top-bar .nav-links a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
            margin-left: 15px;
            font-size: 0.9rem;
        }
        #map {
            width: 100%;
            height: calc(100vh - 50px);
        }
        .legend {
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 12px 16px;
            font-size: 13px;
            line-height: 1.8;
            color: #cbd5e1;
        }
        .legend h4 {
            margin: 0 0 6px 0;
            font-size: 14px;
            color: #f1f5f9;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .legend-swatch {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            border: 1px solid #475569;
            display: inline-block;
        }
        .stats-panel {
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 12px 16px;
            font-size: 13px;
            color: #cbd5e1;
            max-width: 220px;
        }
        .stats-panel h4 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #f1f5f9;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
        }
        .stat-val {
            font-weight: 700;
            color: #f1f5f9;
        }
        .leaflet-popup-content-wrapper {
            background: #1e293b;
            color: #e2e8f0;
            border-radius: 6px;
        }
        .leaflet-popup-tip {
            background: #1e293b;
        }
        .leaflet-popup-content {
            font-size: 13px;
            line-height: 1.5;
        }
        .popup-label {
            font-weight: 700;
            color: #38bdf8;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>Live Disaster Map</h1>
        <div class="nav-links">
            <a href="/upload/">Upload Portal</a>
            <a href="/report/">Situation Report</a>
            <a href="/report/?format=json" target="_blank">JSON API</a>
        </div>
    </div>
    <div id="map"></div>

    <script>
        const reportData = {{ report_json|safe }};

        const map = L.map('map', {
            zoomControl: true,
            attributionControl: true,
        }).setView([20.5937, 78.9629], 5);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Risk color mapping
        const RISK_COLORS = {
            'CRITICAL': '#ef4444',
            'HIGH': '#f97316',
            'MODERATE': '#eab308',
            'LOW': '#22c55e',
        };

        const RISK_FILL_OPACITY = {
            'CRITICAL': 0.45,
            'HIGH': 0.35,
            'MODERATE': 0.25,
            'LOW': 0.15,
        };

        // Layer groups
        const zoneLayer = L.layerGroup().addTo(map);
        const detectionLayer = L.layerGroup().addTo(map);
        const routeLayer = L.layerGroup().addTo(map);

        const bounds = [];

        // Draw zone polygons from priority_zones data
        const zones = reportData.priority_zones || [];
        zones.forEach(function(z) {
            const lat = z.center_lat;
            const lon = z.center_lon;
            const gridSize = 0.001;
            const halfGrid = gridSize / 2;

            const color = RISK_COLORS[z.risk_label] || '#22c55e';
            const fillOpacity = RISK_FILL_OPACITY[z.risk_label] || 0.15;

            const zoneBounds = [
                [lat - halfGrid, lon - halfGrid],
                [lat - halfGrid, lon + halfGrid],
                [lat + halfGrid, lon + halfGrid],
                [lat + halfGrid, lon - halfGrid],
            ];

            const polygon = L.polygon(zoneBounds, {
                color: color,
                weight: 2,
                fillColor: color,
                fillOpacity: fillOpacity,
            }).addTo(zoneLayer);

            let popupContent = '<span class="popup-label">Zone ' + z.zone_id + '</span><br>';
            popupContent += 'Risk: <strong>' + z.risk_label + '</strong> (' + z.risk_score + ')<br>';
            popupContent += 'Confidence: ' + z.confidence + '<br>';
            popupContent += 'Detections: ' + z.detection_count + '<br>';
            if (z.freshness) {
                popupContent += 'Data Age: ' + z.freshness.age_minutes + ' min';
                if (z.freshness.stale_flag) {
                    popupContent += ' <span style="color:#eab308">(STALE)</span>';
                }
            }
            if (z.components) {
                popupContent += '<br><br><strong>Score Breakdown:</strong><br>';
                for (const [key, val] of Object.entries(z.components)) {
                    if (val > 0) {
                        popupContent += key + ': ' + val + '<br>';
                    }
                }
            }

            popupContent += '<br><a href="/mission/' + z.zone_id + '/" style="color:#38bdf8;font-weight:600;font-size:0.85rem">Mission Brief &rarr;</a>';
            polygon.bindPopup(popupContent);
            bounds.push([lat, lon]);
        });

        // Detection class icons (circle markers)
        const CLASS_MARKER_COLORS = {
            'person': '#ef4444',
            'fire': '#f97316',
            'smoke': '#94a3b8',
            'flood_water': '#3b82f6',
            'collapsed_building': '#a855f7',
            'damaged_building': '#d946ef',
            'debris': '#eab308',
            'fallen_tree': '#22c55e',
            'fallen_power_pole': '#14b8a6',
            'power_line': '#6b7280',
            'gas_cylinder': '#f43f5e',
            'vehicle_car': '#06b6d4',
            'vehicle_truck': '#0891b2',
            'vehicle_bus': '#0e7490',
        };

        // Plot recent detections that have lat/lon
        const detections = reportData._detection_markers || [];
        detections.forEach(function(d) {
            if (!d.lat || !d.lon) return;

            const color = CLASS_MARKER_COLORS[d.object_class] || '#64748b';
            const marker = L.circleMarker([d.lat, d.lon], {
                radius: 5,
                fillColor: color,
                color: '#1e293b',
                weight: 1,
                fillOpacity: 0.85,
            }).addTo(detectionLayer);

            marker.bindPopup(
                '<span class="popup-label">' + d.object_class + '</span><br>' +
                'Confidence: ' + d.confidence.toFixed(2) + '<br>' +
                'Source: ' + d.source
            );
            bounds.push([d.lat, d.lon]);
        });

        // Draw safe routes
        const routes = (reportData.roads_and_routes || {}).suggested_safe_routes || [];
        routes.forEach(function(r) {
            if (!r.route || r.route.length < 2) return;
            const latlngs = r.route.map(function(coord) { return [coord[0], coord[1]]; });
            const polyline = L.polyline(latlngs, {
                color: '#22d3ee',
                weight: 4,
                opacity: 0.8,
                dashArray: '10, 6',
            }).addTo(routeLayer);

            polyline.bindPopup(
                '<span class="popup-label">Safe Route</span><br>' +
                'From: Zone ' + r.from_zone + '<br>' +
                'To: ' + r.to + '<br>' +
                'Status: ' + r.status
            );
        });

        // Fit map to data bounds
        if (bounds.length > 0) {
            map.fitBounds(bounds, { padding: [40, 40], maxZoom: 16 });
        }

        // Legend control
        const legend = L.control({ position: 'bottomright' });
        legend.onAdd = function() {
            const div = L.DomUtil.create('div', 'legend');
            div.innerHTML = '<h4>Risk Levels</h4>';
            const levels = [
                { label: 'Critical', color: '#ef4444' },
                { label: 'High', color: '#f97316' },
                { label: 'Moderate', color: '#eab308' },
                { label: 'Low', color: '#22c55e' },
            ];
            levels.forEach(function(l) {
                div.innerHTML += '<div class="legend-item">' +
                    '<span class="legend-swatch" style="background:' + l.color + '"></span>' +
                    l.label + '</div>';
            });
            div.innerHTML += '<br><div class="legend-item">' +
                '<span class="legend-swatch" style="background:#22d3ee;border-radius:50%"></span>' +
                'Safe Route</div>';
            return div;
        };
        legend.addTo(map);

        // Stats panel
        const stats = L.control({ position: 'topright' });
        stats.onAdd = function() {
            const div = L.DomUtil.create('div', 'stats-panel');
            const criticalCount = zones.filter(function(z) { return z.risk_label === 'CRITICAL'; }).length;
            const highCount = zones.filter(function(z) { return z.risk_label === 'HIGH'; }).length;
            const totalZones = zones.length;
            const totalDets = zones.reduce(function(sum, z) { return sum + z.detection_count; }, 0);

            div.innerHTML = '<h4>Situation Overview</h4>' +
                '<div class="stat-row"><span>Total Zones</span><span class="stat-val">' + totalZones + '</span></div>' +
                '<div class="stat-row"><span>Critical</span><span class="stat-val" style="color:#ef4444">' + criticalCount + '</span></div>' +
                '<div class="stat-row"><span>High Risk</span><span class="stat-val" style="color:#f97316">' + highCount + '</span></div>' +
                '<div class="stat-row"><span>Detections</span><span class="stat-val">' + totalDets + '</span></div>' +
                '<div class="stat-row"><span>Safe Routes</span><span class="stat-val">' + routes.length + '</span></div>';
            return div;
        };
        stats.addTo(map);

        // Layer toggle control
        L.control.layers(null, {
            'Risk Zones': zoneLayer,
            'Detection Markers': detectionLayer,
            'Safe Routes': routeLayer,
        }, { position: 'topleft', collapsed: false }).addTo(map);

        // Auto-refresh every 60s
        setInterval(function() {
            fetch('/report/?format=json')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    document.getElementById('refresh-indicator').textContent = 'Updated: ' + new Date().toLocaleTimeString();
                })
                .catch(function() {});
        }, 60000);
    </script>
</body>
</html>
